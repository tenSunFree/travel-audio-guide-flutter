name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

# Explicitly declare minimal permissions: CI only needs read access to repository contents, not write access.
# This is also the permission level Dependabot receives when it triggers this workflow; declaring it makes the intent clear.
permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show Flutter & Dart version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install app_lints dependencies
        working-directory: packages/app_lints
        run: dart pub get

      - name: Analyze app_lints
        working-directory: packages/app_lints
        run: dart analyze

      - name: Restore Firebase config files
        run: |
          for v in FIREBASE_OPTIONS_STAGING_DART_BASE64 FIREBASE_OPTIONS_PRODUCTION_DART_BASE64 \
                   GOOGLE_SERVICES_JSON_STAGING_BASE64 GOOGLE_SERVICES_JSON_PRODUCTION_BASE64; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              exit 1
            fi
          done

          mkdir -p android/app/src/staging android/app/src/production
          mkdir -p lib/config/firebase

          printf '%s' "$FIREBASE_OPTIONS_STAGING_DART_BASE64" | base64 --decode > lib/config/firebase/firebase_options_staging.dart
          printf '%s' "$FIREBASE_OPTIONS_PRODUCTION_DART_BASE64" | base64 --decode > lib/config/firebase/firebase_options_production.dart
          printf '%s' "$GOOGLE_SERVICES_JSON_STAGING_BASE64" | base64 --decode > android/app/src/staging/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON_PRODUCTION_BASE64" | base64 --decode > android/app/src/production/google-services.json
        env:
          FIREBASE_OPTIONS_STAGING_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_STAGING_DART_BASE64 }}
          FIREBASE_OPTIONS_PRODUCTION_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_PRODUCTION_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_STAGING_BASE64 }}
          GOOGLE_SERVICES_JSON_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PRODUCTION_BASE64 }}

      - name: Format generated Firebase config files
        run: dart format lib/config/firebase/firebase_options_staging.dart lib/config/firebase/firebase_options_production.dart

      - name: Check Dart format
        run: dart format --output=none --set-exit-if-changed lib test pigeons
        # Only scan Dart-related folders, do not touch android/ios/build.

      - name: Static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Verify coverage report
        shell: bash
        run: |
          if [[ ! -s coverage/lcov.info ]]; then
            echo "::error::coverage/lcov.info was not generated or is empty."
            exit 1
          fi

          source_count=$(grep -c '^SF:' coverage/lcov.info || true)
          if [[ "$source_count" -eq 0 ]]; then
            echo "::error::coverage/lcov.info contains no source-file records."
            exit 1
          fi

          echo "Coverage report OK — $source_count source files, $(wc -c < coverage/lcov.info) bytes."

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false  # Turn off debugging first to avoid masking the real error messages.
          verbose: true

      - name: Build staging debug APK
        run: |
          flutter build apk --debug \
            --flavor staging \
            -t lib/main_staging.dart

      - name: Build production debug APK
        run: |
          flutter build apk --debug \
            --flavor production \
            -t lib/main_production.dart