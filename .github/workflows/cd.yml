name: Flutter CD

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-rc.*'

permissions:
  contents: write

concurrency:
  group: flutter-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Same script as deploy-rc.yml, so RC and production builds always derive
      # versionCode from the exact same formula. Also validates the tag format,
      # replacing the old separate "Validate production tag" step.
      - name: Compute Android version
        shell: bash
        run: bash scripts/compute_android_version.sh "${GITHUB_REF_NAME}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show Flutter & Dart version
        run: flutter --version

      - name: Restore Firebase config files
        run: |
          mkdir -p android/app/src/production android/app/src/staging
          mkdir -p lib/config/firebase
          printf '%s' "$FIREBASE_OPTIONS_PRODUCTION_DART_BASE64" | base64 --decode > lib/config/firebase/firebase_options_production.dart
          printf '%s' "$FIREBASE_OPTIONS_STAGING_DART_BASE64" | base64 --decode > lib/config/firebase/firebase_options_staging.dart
          printf '%s' "$GOOGLE_SERVICES_JSON_PRODUCTION_BASE64" | base64 --decode > android/app/src/production/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON_STAGING_BASE64" | base64 --decode > android/app/src/staging/google-services.json
        env:
          FIREBASE_OPTIONS_PRODUCTION_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_PRODUCTION_DART_BASE64 }}
          FIREBASE_OPTIONS_STAGING_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_STAGING_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PRODUCTION_BASE64 }}
          GOOGLE_SERVICES_JSON_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_STAGING_BASE64 }}

      - name: Restore release keystore
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release.keystore.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Install dependencies
        run: flutter pub get

      - name: Install app_lints dependencies
        working-directory: packages/app_lints
        run: dart pub get

      - name: Analyze app_lints
        working-directory: packages/app_lints
        run: dart analyze

      - name: Format generated Firebase config files
        run: dart format lib/config/firebase/firebase_options_production.dart lib/config/firebase/firebase_options_staging.dart

      - name: Check Dart format
        run: dart format --output=none --set-exit-if-changed lib test pigeons

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Create runtime configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_ENV: production
          APP_RELEASE: flutter-travel-audio-guide@${{ github.ref_name }}
        run: bash scripts/create_runtime_env.sh

      - name: Build release APK
        run: |
          flutter build apk --release \
            --flavor production \
            -t lib/main_production.dart \
            --build-name="${{ env.APP_VERSION }}" \
            --build-number="${{ env.BUILD_NUMBER }}" \
            --dart-define-from-file=env/ci.json

      - name: Extract changelog for current version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          awk -v version="$VERSION" '
            /^## / {
              if (found) exit
              if ($2 == version) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No update found for ${VERSION} . Please check that CHANGELOG.md has been updated" > release_notes.md
          fi

          {
            echo 'body<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p outputs/release
          cp build/app/outputs/flutter-apk/app-production-release.apk \
            outputs/release/travel-audio-guide-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Version ${{ github.ref_name }}

            ### Updates
            ${{ steps.changelog.outputs.body }}

            ### Version code
            ${{ env.BUILD_NUMBER }}

            ### Installation Method
            1. Download `travel-audio-guide-${{ github.ref_name }}.apk`
            2. Enable "Allow installation of apps from unknown sources" on your phone
            3. Install and run
          files: outputs/release/travel-audio-guide-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}