name: Deploy RC

on:
  push:
    tags:
      - 'v*.*.*-rc.*'

permissions:
  contents: read

concurrency:
  group: deploy-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-rc:
    name: Build & Distribute RC APK
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show Flutter & Dart version
        run: flutter --version

      # Computes:
      #   APP_VERSION  = version name shown to users, e.g. "1.0.8" (no "v", no "-rc.N")
      #   BUILD_NUMBER = Android versionCode, deterministically derived from the tag
      #                  (see scripts/compute_android_version.sh for the formula)
      #   RELEASE_TYPE = "rc" or "release"
      # This replaces --build-number=${{ github.run_number }}, which is unsafe across
      # multiple workflow files (each has its own independent run_number counter) and
      # could produce a NEWER release with a SMALLER versionCode than an older one,
      # causing Android to reject the install as a downgrade.
      # This step also validates the tag format (script exits non-zero on failure),
      # replacing the old separate "Validate tag format" step.
      - name: Compute Android version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=travel-audio-guide-${TAG}.apk" >> "$GITHUB_ENV"
          bash scripts/compute_android_version.sh "${GITHUB_REF_NAME}"

      - name: Restore Firebase config files
        run: |
          for v in FIREBASE_OPTIONS_PRODUCTION_DART_BASE64 FIREBASE_OPTIONS_STAGING_DART_BASE64 \
                   GOOGLE_SERVICES_JSON_PRODUCTION_BASE64 GOOGLE_SERVICES_JSON_STAGING_BASE64; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              exit 1
            fi
          done

          mkdir -p android/app/src/production android/app/src/staging
          mkdir -p lib/config/firebase

          printf '%s' "$FIREBASE_OPTIONS_PRODUCTION_DART_BASE64" | base64 --decode > lib/config/firebase/firebase_options_production.dart
          printf '%s' "$FIREBASE_OPTIONS_STAGING_DART_BASE64" | base64 --decode > lib/config/firebase/firebase_options_staging.dart
          printf '%s' "$GOOGLE_SERVICES_JSON_PRODUCTION_BASE64" | base64 --decode > android/app/src/production/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON_STAGING_BASE64" | base64 --decode > android/app/src/staging/google-services.json
        env:
          FIREBASE_OPTIONS_PRODUCTION_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_PRODUCTION_DART_BASE64 }}
          FIREBASE_OPTIONS_STAGING_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_STAGING_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PRODUCTION_BASE64 }}
          GOOGLE_SERVICES_JSON_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_STAGING_BASE64 }}

      - name: Restore release keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release.keystore.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Install dependencies
        run: flutter pub get

      - name: Install app_lints dependencies
        working-directory: packages/app_lints
        run: dart pub get

      - name: Analyze app_lints
        working-directory: packages/app_lints
        run: dart analyze

      - name: Format generated Firebase config files
        run: dart format lib/config/firebase/firebase_options_production.dart lib/config/firebase/firebase_options_staging.dart

      - name: Check Dart format
        run: dart format --output=none --set-exit-if-changed lib test pigeons

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Create runtime configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_ENV: rc
          APP_RELEASE: flutter-travel-audio-guide@${{ env.TAG }}
        run: bash scripts/create_runtime_env.sh

      - name: Build RC APK
        run: |
          flutter build apk --release \
            --flavor production \
            --build-name="${{ env.APP_VERSION }}" \
            --build-number="${{ env.BUILD_NUMBER }}" \
            --dart-define-from-file=env/ci.json \
            -t lib/main_production.dart

      - name: Rename APK
        run: |
          mkdir -p outputs/rc
          cp build/app/outputs/flutter-apk/app-production-release.apk \
            outputs/rc/${{ env.APK_NAME }}

      - name: Create release notes
        run: |
          cat > release_notes.txt <<EOF
          Release Candidate

          Tag: v${{ env.TAG }}
          Version name: ${{ env.APP_VERSION }}
          Version code: ${{ env.BUILD_NUMBER }}
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.run_number }} (attempt ${{ github.run_attempt }})
          APK: ${{ env.APK_NAME }}
          EOF

      - name: Restore Firebase service account
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON_BASE64"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > firebase-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json
        run: |
          firebase appdistribution:distribute outputs/rc/${{ env.APK_NAME }} \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID_PRODUCTION }}" \
            --groups "${{ secrets.FIREBASE_TESTER_GROUPS_RC }}" \
            --release-notes-file release_notes.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: outputs/rc/${{ env.APK_NAME }}
          retention-days: 30