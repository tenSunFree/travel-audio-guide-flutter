name: Integration Test

# Strategy
#
# PR -> main/develop
#   -> smoke
#      API 36 + Pixel 6
#
# PR -> release/**
# push -> release/**
# nightly
# manual full
#   -> compatibility matrix
#
# Compatibility dimensions are intentionally sampled independently.
# This is NOT:
#
#   API x device x orientation
#
# because a full Cartesian product would be unnecessarily expensive.
#
# Phase 1:
# Keep this workflow report-only until runtime / flakiness / emulator
# stability have been observed.
#
# IMPORTANT:
# If "Integration result" becomes a required branch-protection check,
# remove paths-ignore below. GitHub leaves path-filtered required checks
# pending when the workflow does not run.

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

  push:
    branches:
      - 'release/**'

  schedule:
    # 02:00 Asia/Taipei = 18:00 UTC (previous day).
    # GitHub scheduled workflows run from the default branch.
    - cron: '0 18 * * *'

  workflow_dispatch:
    inputs:
      suite:
        description: Integration test suite
        type: choice
        options:
          - smoke
          - full
        default: smoke

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}

  # Only superseded PR runs should be cancelled.
  # Release pushes / nightly / manual runs should be allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.44.9'

  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64

jobs:
  # ===========================================================================
  # Select smoke or compatibility matrix
  # ===========================================================================
  plan:
    name: Plan integration tests

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Select matrix
        id: matrix
        shell: bash

        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_SUITE: ${{ github.event.inputs.suite }}

        run: |
          set -euo pipefail

          full=false

          case "$EVENT_NAME" in
            schedule|push)
              full=true
              ;;

            pull_request)
              if [[ "$BASE_REF" == release/* ]]; then
                full=true
              fi
              ;;

            workflow_dispatch)
              if [[ "$INPUT_SUITE" == "full" ]]; then
                full=true
              fi
              ;;
          esac

          # -------------------------------------------------------------------
          # Full compatibility suite
          #
          # API compatibility:
          #
          #   minSdk     API 26
          #   production API 36
          #   latest     API 37
          #
          # Layout compatibility:
          #
          #   normal phone
          #   small phone
          #   tablet
          #
          # Orientation:
          #
          #   Tablet executes both natural orientation and +90 degrees.
          #
          # This deliberately avoids:
          #
          #   API x device x rotation
          #
          # Cartesian-product testing.
          # -------------------------------------------------------------------

          if [[ "$full" == "true" ]]; then

            matrix=$(cat <<'JSON'
          {
            "include": [
              {
                "name": "min-api",
                "api": 26,
                "profile": "pixel_6",
                "rotations": "0"
              },
              {
                "name": "production",
                "api": 36,
                "profile": "pixel_6",
                "rotations": "0"
              },
              {
                "name": "latest",
                "api": 37,
                "profile": "pixel_6",
                "rotations": "0"
              },
              {
                "name": "small-phone",
                "api": 36,
                "profile": "Nexus 5",
                "rotations": "0"
              },
              {
                "name": "tablet",
                "api": 36,
                "profile": "pixel_tablet",
                "rotations": "0 1"
              }
            ]
          }
          JSON
            )

          else

            matrix=$(cat <<'JSON'
          {
            "include": [
              {
                "name": "smoke",
                "api": 36,
                "profile": "pixel_6",
                "rotations": "0"
              }
            ]
          }
          JSON
            )

          fi

          echo "Selected matrix:"
          jq . <<<"$matrix"

          echo "matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"


  # ===========================================================================
  # Android emulator integration tests
  # ===========================================================================
  android-integration:
    name: Android — ${{ matrix.name }} (API ${{ matrix.api }})

    needs:
      - plan

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # Fork / Dependabot PRs cannot access repository secrets.
    # The staging flavor requires google-services.json at build time.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )

    strategy:
      fail-fast: false

      # Avoid starting too many hardware-accelerated emulators simultaneously.
      max-parallel: 2

      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # -----------------------------------------------------------------------
      # Source
      # -----------------------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v7

        with:
          persist-credentials: false


      # -----------------------------------------------------------------------
      # Java
      # -----------------------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v6

        with:
          distribution: temurin
          java-version: '17'


      # -----------------------------------------------------------------------
      # Gradle cache
      # -----------------------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      # -----------------------------------------------------------------------
      # Flutter
      # -----------------------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2

        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # -----------------------------------------------------------------------
      # Dependencies
      # -----------------------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get


      # -----------------------------------------------------------------------
      # Firebase staging configuration
      # -----------------------------------------------------------------------

      - name: Restore staging google-services.json
        shell: bash

        env:
          GOOGLE_SERVICES_JSON_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_STAGING_BASE64 }}

        run: |
          set -euo pipefail

          if [[ -z "$GOOGLE_SERVICES_JSON_STAGING_BASE64" ]]; then
            echo "::error::Missing secret: GOOGLE_SERVICES_JSON_STAGING_BASE64"
            exit 1
          fi

          mkdir -p android/app/src/staging

          printf '%s' "$GOOGLE_SERVICES_JSON_STAGING_BASE64" \
            | base64 --decode \
            > android/app/src/staging/google-services.json


      # -----------------------------------------------------------------------
      # Hardware acceleration
      # -----------------------------------------------------------------------

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      # -----------------------------------------------------------------------
      # AVD snapshot cache
      #
      # API + target + arch + device profile identify the AVD.
      #
      # Rotation is runtime state, therefore it is intentionally NOT part
      # of the cache key.
      # -----------------------------------------------------------------------

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v5

        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*

          key: avd-v2-${{ runner.os }}-${{ matrix.api }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ matrix.profile }}


      # -----------------------------------------------------------------------
      # Create clean snapshot once
      # -----------------------------------------------------------------------

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'

        uses: reactivecircus/android-emulator-runner@v2

        with:
          api-level: ${{ matrix.api }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ matrix.profile }}

          force-avd-creation: false

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none

          # Snapshot creation should happen with normal emulator state.
          disable-animations: false

          script: echo "Generated clean AVD snapshot."


      # -----------------------------------------------------------------------
      # Integration tests
      # -----------------------------------------------------------------------

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2

        env:
          DEVICE_ID: emulator-5554

          FLAVOR: staging

          ROTATIONS: ${{ matrix.rotations }}

          LABEL: ${{ matrix.name }}-api${{ matrix.api }}

        with:
          api-level: ${{ matrix.api }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ matrix.profile }}

          force-avd-creation: false

          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none

          disable-animations: true

          # Keep this a single command.
          #
          # android-emulator-runner parses multiline script input,
          # therefore loops / functions / traps belong in the shell script.
          script: bash scripts/ci/run_emulator_tests.sh


      # -----------------------------------------------------------------------
      # Diagnostics
      # -----------------------------------------------------------------------

      - name: Upload failure artifacts
        if: failure()

        uses: actions/upload-artifact@v7

        with:
          name: integration-${{ matrix.name }}-api${{ matrix.api }}

          path: build/ci-artifacts/**

          if-no-files-found: ignore

          retention-days: 7


  # ===========================================================================
  # Stable aggregate result
  #
  # Branch Protection should eventually require ONLY this check:
  #
  #   Integration result
  #
  # instead of requiring individual matrix jobs.
  # ===========================================================================
  integration-result:
    name: Integration result

    needs:
      - plan
      - android-integration

    if: always()

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify integration result
        shell: bash

        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.android-integration.result }}

        run: |
          set -euo pipefail

          echo "plan=$PLAN_RESULT"
          echo "android-integration=$TEST_RESULT"

          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::Integration test planning failed."
            exit 1
          fi

          case "$TEST_RESULT" in
            success)
              echo "Integration tests passed."
              ;;

            skipped)
              echo "Integration tests were skipped."
              ;;

            failure|cancelled)
              echo "::error::Integration tests did not pass."
              exit 1
              ;;

            *)
              echo "::error::Unexpected integration test result: $TEST_RESULT"
              exit 1
              ;;
          esac
