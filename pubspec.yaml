name: flutter_travel_audio_guide
description: "Travel audio guide app with audio download, offline playback, and a built-in media player, built using Riverpod and Clean Architecture."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.9+9

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  add_2_calendar: ^3.1.1
  audioplayers: ^5.2.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  firebase_analytics: ^12.5.0
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.4.3
  flutter_widget_from_html_core: ^0.17.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^16.2.0
  json_annotation: ^4.11.0
  path: ^1.9.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  sentry_dio: ^9.29.0
  sentry_flutter: ^9.7.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  # Android/iOS required
  sqlite3_flutter_libs: ^0.6.0+eol
  supabase_flutter: ^2.17.2
  talker_dio_logger: ^5.1.20
  talker_flutter: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  geolocator_platform_interface: ^4.3.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  # native_toolchain_c also indirectly introduces hooks, and downgrades them accordingly.
  native_toolchain_c: 0.19.4
  # Objective-C was originally indirectly pulled into version 9.3.0 by PathProviderFoundation.
  # This version depends on the Hooks suite, causing Dart Compile to throw an error in the build runner.
  # Downgrade to a version without Hooks to resolve the issue.
  objective_c: ^9.6.0
  path_provider_platform_interface: ^2.1.3
  # Removed flutter_lints to avoid overlapping of two baselines.
  # flutter_lints: ^6.0.0
  pigeon: ^26.3.4
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.1
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
